{% extends "base.html" %}
{% block title %}Register — CTF{% endblock %}

{% block content %}
<div class="page-title"><span class="icon">📝</span> Create Account</div>

<div class="card" style="max-width:440px;">
    <form method="POST" action="{{ url_for('register') }}">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required minlength="3" maxlength="32"
                autocomplete="username" placeholder="3-32 characters">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required minlength="6" autocomplete="new-password"
                placeholder="Min 6 characters">
        </div>
        <div class="form-group">
            <label for="confirm_password">Confirm Password</label>
            <input type="password" id="confirm_password" name="confirm_password" required autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;margin-top:0.5rem;">
            Register
        </button>
    </form>
    <p style="margin-top:1rem;font-size:0.85rem;color:var(--muted);">
        Already have an account? <a href="{{ url_for('login') }}">Log in</a>
    </p>
</div>
{% endblock %}
